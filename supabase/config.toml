project_id = "rexrun-mobile-test"

[functions.rexrun-ota-publish]
# The function authenticates every mutation with a short-lived RSA-signed request.
verify_jwt = false
entrypoint = "./functions/rexrun-ota-publish/index.ts"
import_map = "./functions/rexrun-ota-publish/deno.json"

[functions.rexrun-notify]
enabled = true
verify_jwt = false
import_map = "./functions/rexrun-notify/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/rexrun-notify/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/rexrun-notify/*.html" ]
