name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-flow:
    name: Git Flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check PR branch direction
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node .github/scripts/check-git-flow.mjs

  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check deployment guards and native compatibility
        working-directory: .
        run: |
          python3 -m unittest discover -s infra/aws/diet -p 'test_*.py'
          node --test deployment/*.test.mjs
          node deployment/release.mjs --validate-config
      - name: Validate immutable BP history and forecast research contracts
        working-directory: .
        run: |
          python3 -m unittest discover -s ai/bp_forecast/tests -v
          npm install --prefix .cache/bp-journal-tools --package-lock=false --ignore-scripts --no-save @electric-sql/pglite@0.5.14
          node supabase/tests/bp-journal.mjs
      - name: Validate diet and exercise service without external AI calls
        working-directory: services/diet-f6
        run: |
          python3 -m pip install -r requirements.txt pytest==9.1.1
          PYTHONPATH=. python3 -m pytest tests -q
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  browser:
    name: Browser shard ${{ matrix.shard }}/4
    needs: frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run all browser scenarios across four shards
        env:
          SHARD: ${{ matrix.shard }}
        run: npm run test:e2e -- --shard="$SHARD/4"
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android compile
    needs: frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/android-toolchain
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Compile Android without production signing secrets
        working-directory: frontend/android
        run: bash ./gradlew assembleDebug --no-daemon

  frontend:
    name: Frontend
    if: always()
    needs: [frontend-check, browser, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require checks and every browser shard
        env:
          CHECKS_RESULT: ${{ needs.frontend-check.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success && test "$ANDROID_RESULT" = success
