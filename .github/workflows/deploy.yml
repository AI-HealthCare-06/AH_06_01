name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rexrun-production
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main
  verify:
    needs: source
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
        working-directory: frontend
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: "862330372849"
          role-session-name: rexrun-${{ github.run_id }}
      - name: Build and publish verified main
        env:
          REXRUN_SIGNING_BUNDLE: ${{ secrets.REXRUN_SIGNING_BUNDLE }}
          REXRUN_SOURCE_SHA: ${{ github.sha }}
          REXRUN_RELEASE_NUMBER: ${{ github.run_number }}
        run: node deployment/release.mjs
      - name: Save APK and public release provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rexrun-main-${{ github.sha }}
          path: |
            .cache/mobile/firebase/*-upgrade.apk
            .cache/production-release/release.json
          if-no-files-found: error
          retention-days: 30
