<!doctype html><html lang="ko"><meta charset="utf-8"><title>REXRUN 현재 와이어프레임</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.7 "Malgun Gothic",sans-serif;color:#202b32;background:#f0f2f4}aside{position:fixed;inset:0 auto 0 0;width:245px;padding:24px;background:white;overflow:auto;border-right:1px solid #ccd2d8}button{display:block;width:100%;margin:7px 0;padding:10px;text-align:left;border:1px solid #c4cbd2;background:#fff;cursor:pointer}button.active{background:#dfe9ee}main{margin-left:245px;padding:36px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:28px}article{padding:20px;background:white;border:1px solid #c8d0d8}article h2{font-size:17px}.phone{border:2px solid #606b75;border-radius:18px;padding:15px;min-height:440px;display:flex;flex-direction:column;gap:13px}.phone div{padding:15px;border:1px solid #bfc7cf;background:#f1f3f5}.phone footer{margin-top:auto;font-size:11px;border-top:1px solid #ccc;padding-top:12px}small{overflow-wrap:anywhere}header{margin-bottom:30px}article.selected{outline:3px solid #35576b}a{color:#31566d}@media(max-width:700px){aside{position:static;width:auto}main{margin:0;padding:20px}}@media print{aside{display:none}main{margin:0}.cards{grid-template-columns:repeat(3,1fr)}article{break-inside:avoid}}</style><aside><b>REXRUN 화면 목록</b><button onclick="showAll()">모든 화면</button><nav></nav></aside><main><header><h1>REXRUN 현재 와이어프레임</h1><p>구현된 화면·모달 흐름을 정리한 저해상도 구조도입니다. 미리보기 디자인을 바꾸는 작업은 포함하지 않습니다.</p><p>기준일 2026-10-29 · SQL·서버 명세와 화면 URL을 구분했습니다.</p></header><div class="cards"></div></main><script>const screens=[["01", "로그인", "/login", "이메일 / 비밀번호|로그인 · 소셜 로그인|사무직 A 30일 데모|기존 고혈압 당뇨 7일 데모", "인증 성공 → 기본 정보 또는 홈. 데모는 별도 저장 공간."], ["02", "최초 기본 정보", "/profile", "이름 · 성별 · 나이|키 · 몸무게|다음: 혈압 정보", "처음에는 기본 정보와 혈압만 수집."], ["03", "최초 혈압 정보", "/profile", "최근 혈압 / 측정 여부|진단 / 치료 상태|확인하고 완료", "지병·생활습관은 첫 주 퀘스트로 분리."], ["04", "첫 주 상세 기록", "/profile?section=conditions|lifestyle", "지병 / 없음 / 모름|생활습관과 가족력|작성 후 저장 · 첫 주 EXP", "프로필 내부 섹션 흐름. query는 실제 URL 라우트가 아닌 섹션 설명."], ["05", "공룡 선택", "/dinosaur", "공룡 목록 / 티라노|선택 공룡 미리보기|확인", "선택 → 첫 결과. 장식 UI와 건강 정보는 분리."], ["06", "첫 분석", "/first-result", "입력 요약|분석 준비 / 결과 / 자료 대기|모험 시작", "M1 평가 거절도 정상 품질 상태로 표시."], ["07", "홈", "/home", "프로필 / 날씨 / 메뉴|전투 화면 · HP · Gold 유입|버프 / 게임 설정|DINO RADAR → 대시보드|남은 오늘 퀘스트", "하단 5탭. BGM/SFX는 게임 설정에서 제어."], ["08", "메인 퀘스트", "/quests", "Today Quest + 주간 보상 진행|Main Quest / Sub Quest|건강 서베이|약 영양제 / 식사 / 6000걸음", "행 선택 → 설명 모달. 물은 Sub Quest."], ["09", "서브 퀘스트", "/quests · Sub Quest", "전날 결과 / M1 M2 상태|우선순위와 이유|물 마시기 실천|모델 연결 대기 / 오류 상태", "별도 경로가 아닌 탭 상태. 서버 Ranker 서비스와 프런트 우선순위 구분."], ["10", "퀘스트 설명 모달", "/quests · dialog", "설명과 실제 완료 조건|진행 / 최초 EXP / 버프|인증하기|취소", "촬영 퀘스트 → 카메라 모달. 서베이 → 페이지식 설문 모달."], ["11", "인증 카메라 모달", "/quests · camera dialog", "자동 선택된 퀘스트|카메라 미리보기|촬영 / 다시 촬영|사진 확인 / 인증", "다른 퀘스트 필터를 두지 않음. 기존 인증 흐름과 /cv 실험 분리."], ["12", "직접 카메라", "/camera?quest=...", "선택 퀘스트|카메라 / 사진 확인|식사 사진 분석 진입|복약 일정 선택", "퀘스트 파라미터가 없으면 /quests로 이동."], ["13", "건강 서베이 혈압", "/daily-survey · modal", "단계 진행 / 닫기|아침 혈압 / 저녁 혈압|미측정 선택|다음", "모달 배경 유지. 항목별 페이지 전환."], ["14", "건강 서베이 맥박", "/daily-survey · modal", "안정 시 맥박 / 미측정|숫자 단위는 입력칸 우측 상단|이전 / 다음", "알 수 없는 값은 임의 숫자로 채우지 않음."], ["15", "건강 서베이 수면", "/daily-survey · modal", "취침 시각 / 기상 시각|시간 버튼 길게 눌러 반복|코골이 / 낮 졸림 슬라이더|모름 / 이전 / 다음", "수면 기록에 따라 추가 EXP. 설명은 ? 툴팁."], ["16", "건강 서베이 검토", "/daily-survey · modal", "혈당 / 활동 / 좌식 시간|선택 항목 라디오 / 건너뛰기|응답 검토|저장", "날짜별 dailySurveys 저장 → 분석 입력과 수면 EXP."], ["17", "약 영양제 목록", "/medications", "복용 중인 약|우측 상단 알림 스위치|일정과 복용 상태|약 영양제 추가", "알림 상세 카드 대신 간단한 스위치."], ["18", "약 영양제 등록 모달", "/medications · dialog", "약 / 영양제|이름 · 복용량|질환 또는 성분|시간 Pixel Time Picker|저장 / 취소", "영양제이면 관련 질환 대신 성분. 미등록 약을 만들어 넣지 않음."], ["19", "식단 기록", "/meals", "사진 선택 / 직접 입력|외부 AI 전송 동의|음식명 / 중량 / 영양 검토|확인 저장 / 기록 목록", "현재 개발용 영양 DB. 예시 결과는 실제 기록 저장 금지."], ["20", "모션 캡처 실험", "/cv?task=...", "물 / 경구 복약 / 주사|전면 카메라 / 관찰 부위|단계 진행 / 종료|결과 / JSON 다운로드", "실험적 과정 인식. 실제 섭취·용량 확인이나 게임 보상과 연결하지 않음."], ["21", "건강 대시보드", "/dashboard", "조회 기간 / 날짜 캘린더|Health Score + 3개 링|혈압 / 혈당 / 맥박 추이|M1 M2 / 상세 보고서", "실천 점수와 혈압 기준 밴드·모델 위험 수준은 별개."], ["22", "상세 건강 보고서", "/dashboard/report", "기간별 실천 점수|퀘스트 / 등록일|혈압 기록과 모델 해석|추이 / 참고 예측 / 기록 입력", "요약과 같은 조회 기간. 일부 질환 위험 카드에는 데모 값이 남아 있음."], ["23", "상점", "/shop · /shop/customize", "Gold / RP 잔액|Gold 1000 : RP 1 교환|실물 상품 / 쿠팡 기준 정가|꾸미기 / 공격 모션 구매", "실물 정가 미확인 상품은 확인 중 표시. 실제 결제 API 없음."], ["24", "캐릭터 보관함", "/character", "공룡 스와이프 선택|캐릭터 / HEAD / PET 슬롯|스킨 스와이프 선택|상점 진입", "전투 ATK/HP 요약 중복 표시는 제거된 상태."], ["25", "장착 아이템 모달", "/character · equipment dialog", "보유 장식 또는 펫 목록|현재 장착 표시|장착 / 해제|닫기", "공격 모션 구매는 상점에서. 보유 목록이 비면 빈 상태."], ["26", "마이페이지", "/me", "프로필 이미지 / GIF 업로드|프로필 / 계정 동기화|앱 업데이트 하이라이트|글자 크기 / 연결 / 로그아웃", "성별에 맞는 기본 아바타. 계정 데이터·업데이트는 목록 → 상세."], ["27", "설정 상세 모달", "/me · dialog", "동기화 동의 / 대기 배치|업데이트 버전 / 확인 / 설치|기기 연결 / 알림|뒤로 / 닫기", "하드웨어 뒤로가기는 홈 복귀 후 두 번 눌러 종료."], ["28", "상태와 호환 경로", "/reward · /buff · /risk · /withered", "보상 / 버프 / 위험 참고|실패 / 재도전 상태|구 캐릭터 대시보드 URL 리다이렉트|홈으로 돌아가기", "/dashboard/character 및 report는 건강 대시보드로 이동. 미정의 경로 → 홈."]];const cards=document.querySelector('.cards');for(const [n,t,r,b,d] of screens){let a=document.createElement('article');a.id='screen-'+n;a.innerHTML='<h2>'+n+' '+t+'</h2><p><small>'+r+'</small></p><section class="phone">'+b.split('|').map(x=>'<div>'+x+'</div>').join('')+(Number(n)>=7?'<footer>Shop　Character　Home　Quest　Dashboard</footer>':'')+'</section><p>'+d+'</p>';cards.append(a);let btn=document.createElement('button');btn.textContent=n+' '+t;btn.onclick=()=>{showAll();a.classList.add('selected');a.scrollIntoView({behavior:'smooth',block:'start'})};document.querySelector('nav').append(btn)}function showAll(){document.querySelectorAll('article').forEach(a=>a.classList.remove('selected'))}</script></html>
